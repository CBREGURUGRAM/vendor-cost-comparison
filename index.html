<div id="root"></div>
<script type="text/babel" data-presets="react">
const { useState, useEffect, useMemo } = React;

/* ================= CLOUD SYNC SETTINGS - edit these two lines ================= */
const CLOUD={
  clientId:'PASTE_YOUR_GOOGLE_CLIENT_ID.apps.googleusercontent.com', // Google Cloud > Credentials > OAuth client ID (Web)
  allowedEmail:'yourname@gmail.com'                                  // the ONE Gmail account allowed to use this app
};
const CLOUD_ON=()=>!/^PASTE/.test(CLOUD.clientId)&&!/^yourname@/.test(CLOUD.allowedEmail);
/* Data is stored in that account's private Google Drive app folder (hidden, only this app can read it).
   Left unconfigured, the app runs in local-only mode exactly as before. */
const Cloud={token:null,exp:0,email:null,fileId:null};
function waitGoogle(){ return new Promise((res,rej)=>{ let n=0; const t=setInterval(()=>{ if(window.google&&google.accounts&&google.accounts.oauth2){clearInterval(t);res();} else if(++n>50){clearInterval(t);rej(new Error('Google sign-in could not load. Check your internet connection.'));} },100); }); }
async function cloudSignIn(prompt){
  await waitGoogle();
  return new Promise((res,rej)=>{
    const c=google.accounts.oauth2.initTokenClient({client_id:CLOUD.clientId,scope:'openid email https://www.googleapis.com/auth/drive.appdata',hint:CLOUD.allowedEmail,
      callback:async r=>{
        if(r.error) return rej(new Error(r.error_description||r.error));
        try{
          const u=await (await fetch('https://www.googleapis.com/oauth2/v3/userinfo',{headers:{Authorization:'Bearer '+r.access_token}})).json();
          if((u.email||'').toLowerCase()!==CLOUD.allowedEmail.toLowerCase()){ google.accounts.oauth2.revoke(r.access_token,()=>{}); return rej(new Error('This app is locked to '+CLOUD.allowedEmail+'. You signed in as '+(u.email||'another account')+'.')); }
          Cloud.token=r.access_token; Cloud.exp=Date.now()+(r.expires_in-60)*1000; Cloud.email=u.email; res(u.email);
        }catch(e){ rej(e); }
      },
      error_callback:e=>rej(new Error(e.type==='popup_closed'?'Sign-in window was closed.':(e.type||'Sign-in failed')))});
    c.requestAccessToken({prompt:prompt});
  });
}
async function cloudEnsureToken(){ if(!(Cloud.token&&Date.now()<Cloud.exp)) await cloudSignIn(''); }
async function drive(path,opts){ const r=await fetch('https://www.googleapis.com'+path,{...opts,headers:{Authorization:'Bearer '+Cloud.token,...((opts&&opts.headers)||{})}}); if(!r.ok) throw new Error('Google Drive error '+r.status); return r; }
async function cloudFindFile(){ if(Cloud.fileId) return Cloud.fileId; const j=await (await drive('/drive/v3/files?spaces=appDataFolder&fields=files(id)&q='+encodeURIComponent("name='vcc-data.json'"))).json(); Cloud.fileId=j.files&&j.files[0]?j.files[0].id:null; return Cloud.fileId; }
async function cloudPull(){ const id=await cloudFindFile(); return id?(await drive('/drive/v3/files/'+id+'?alt=media')).json():null; }
async function driveUpload(name,payload,id){
  const B='vccboundary', meta=id?{}:{name:name,parents:['appDataFolder']};
  const body='--'+B+'\r\nContent-Type: application/json\r\n\r\n'+JSON.stringify(meta)+'\r\n--'+B+'\r\nContent-Type: application/json\r\n\r\n'+JSON.stringify(payload)+'\r\n--'+B+'--';
  const r=await drive('/upload/drive/v3/files'+(id?'/'+id:'')+'?uploadType=multipart&fields=id',{method:id?'PATCH':'POST',headers:{'Content-Type':'multipart/related; boundary='+B},body});
  return (await r.json()).id;
}
async function cloudListBackups(){ const j=await (await drive('/drive/v3/files?spaces=appDataFolder&orderBy=name%20desc&pageSize=100&fields=files(id,name)&q='+encodeURIComponent("name contains 'vcc-backup-'"))).json(); return j.files||[]; }
async function cloudPushNow(){
  const comparisons=loadComparisons(); if(!comparisons.length && !Cloud.fileId && !(await cloudFindFile())) return;
  const payload={app:'vendor-cost-comparison',ts:safeNum(localStorage.getItem('vcc_local_ts'))||Date.now(),lastRef:loadLastRef(),comparisons};
  Cloud.fileId=await driveUpload('vcc-data.json',payload,await cloudFindFile());
  const day=new Date().toISOString().slice(0,10); // one dated backup file per day, newest 14 kept
  if(localStorage.getItem('vcc_cloud_bk_day')!==day){
    await driveUpload('vcc-backup-'+day+'.json',payload,null); localStorage.setItem('vcc_cloud_bk_day',day);
    const all=await cloudListBackups(); for(const f of all.slice(14)) await drive('/drive/v3/files/'+f.id,{method:'DELETE'});
  }
}

/* ---------------- calculation engine ---------------- */
const MAX_LINES = Infinity; // no cap on BOQ lines
const DEFAULT_GST = 18;
const CBRE_FEE_PCT = 3; // default fee applied automatically when a vendor name contains "CBRE" (user-editable per vendor)

function isCBRE(name){ return /cbre/i.test((name||'').trim()); }
function round2(n){ return Math.round((n+Number.EPSILON)*100)/100; }
function rateKey(vId,lId){ return vId+'::'+lId; }
function safeNum(v){ const n = typeof v==='number'?v:parseFloat(v); return Number.isFinite(n)?n:0; }
function uid(p){ return p+'_'+Math.random().toString(36).slice(2,9); }

function formatINR(v){
  return '₹' + new Intl.NumberFormat('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2}).format(Number.isFinite(v)?v:0);
}
// jsPDF's standard fonts (Helvetica) do NOT include the ₹ glyph (U+20B9) — that mismatch
// is what was rendering as a broken box / cross mark in the old PDF. The PDF always uses
// "Rs." instead so every character is guaranteed to exist in the font.
function formatINRPdf(v){
  return 'Rs. ' + new Intl.NumberFormat('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2}).format(Number.isFinite(v)?v:0);
}

function computeVendorResult(vendor, lines, rates){
  const cbre = isCBRE(vendor.name);
  const lineResults = [];
  const missing = [];
  let basic=0, lineGstTotal=0, gstWeighted=0;
  lines.forEach(line=>{
    const qty = line.qty;
    const rate = rates[rateKey(vendor.id,line.id)];
    const hasQty = qty!==null && qty!==undefined && qty>0;
    const hasRate = rate!==null && rate!==undefined && !Number.isNaN(rate);
    let amount=null, gst=0;
    if(hasQty && hasRate){
      amount = round2(qty*rate);
      gst = round2(amount*(line.gstPercent/100));
      basic += amount; lineGstTotal += gst; gstWeighted += amount*line.gstPercent;
    } else if(hasQty && !hasRate){
      missing.push(line.sno);
    }
    lineResults.push({lineId:line.id,sno:line.sno,description:line.description,qty,rate:hasRate?rate:null,amount,gstPercent:line.gstPercent,lineGst:gst});
  });
  basic = round2(basic); lineGstTotal = round2(lineGstTotal);
  // Management fee is fully user-editable for every vendor (CBRE or not). The UI layer
  // is responsible for defaulting it (CBRE->3%, non-CBRE->0%) only until the user
  // manually overrides it; here we just trust whatever numeric value is stored.
  const feePct = (typeof vendor.feePercent==='number' && !Number.isNaN(vendor.feePercent) && vendor.feePercent>=0) ? vendor.feePercent : (cbre?CBRE_FEE_PCT:0);
  const fee = round2(basic*(feePct/100));
  const wAvgGst = basic>0 ? gstWeighted/basic : 0;
  const feeGst = round2(fee*(wAvgGst/100));
  const gstAmount = round2(lineGstTotal+feeGst);
  const taxable = round2(basic+fee);
  const grand = round2(taxable+gstAmount);
  return {vendor,isCBRE:cbre,lines:lineResults,basicSubtotal:basic,managementFeePercent:feePct,managementFee:fee,
    weightedAvgGstPercent:round2(wAvgGst),gstAmount,taxableAmount:taxable,grandTotal:grand,isComplete:missing.length===0,missingLineNumbers:missing};
}

function rankVendors(results){
  const rankable = results.filter(r=>r.isComplete);
  const notRankable = results.filter(r=>!r.isComplete);
  const sorted = [...rankable].sort((a,b)=>a.grandTotal-b.grandTotal);
  const ranked=[];
  sorted.forEach((res,i)=>{
    let rank, tie=false;
    if(i>0 && sorted[i-1].grandTotal===res.grandTotal){
      rank = ranked[i-1].rank; tie=true; ranked[i-1]={...ranked[i-1],isTie:true};
    } else { rank = 'L'+(i+1); } // dynamic - not capped at L3, works for any vendor count
    ranked.push({...res, rank, isTie:tie});
  });
  const unranked = notRankable.map(r=>({...r,rank:'NR',isTie:false}));
  return [...ranked, ...unranked];
}
function rankOrderValue(rank){
  if(rank==='NR') return Number.MAX_SAFE_INTEGER;
  const n = parseInt(String(rank).replace('L',''),10);
  return Number.isFinite(n) ? n : Number.MAX_SAFE_INTEGER-1;
}
// Maps any rank to one of the 10 defined colour classes (cycling for L11+). Only the
// colour cycles - the badge/label text always shows the vendor's true rank (e.g. "L11").
function rankColorClass(rank){
  if(rank==='NR') return 'NR';
  const n = parseInt(String(rank).replace('L',''),10);
  if(!Number.isFinite(n) || n<1) return 'NR';
  return 'L'+(((n-1)%10)+1);
}
function exportOrder(results){
  const ranked = rankVendors(results);
  return [...ranked].sort((a,b)=>rankOrderValue(a.rank)-rankOrderValue(b.rank));
}

/* ---------------- persistence ---------------- */
const LS_COMPARISONS = 'vcc_comparisons_v1';
const LS_LASTREF = 'vcc_last_ref_v1';

function loadComparisons(){ try{ return JSON.parse(localStorage.getItem(LS_COMPARISONS)||'[]'); }catch(e){ return []; } }
const LS_BACKUPS='vcc_backups_v1';
function loadBackups(){ try{ return JSON.parse(localStorage.getItem(LS_BACKUPS)||'[]'); }catch(e){ return []; } }
function pushBackup(list,reason){
  let b=loadBackups(); b.unshift({ts:Date.now(),reason:reason||'Save',count:list.length,data:list}); b=b.slice(0,12);
  while(b.length){ try{ localStorage.setItem(LS_BACKUPS,JSON.stringify(b)); return; }catch(e){ b.pop(); } }
}
function saveComparisons(list,reason,noCloud){
  try{ localStorage.setItem(LS_COMPARISONS, JSON.stringify(list)); }
  catch(e){ alert('Browser storage is full - the save did not complete. Download a full backup from the dashboard and clear older comparisons.'); return false; }
  if(!noCloud){ localStorage.setItem('vcc_local_ts',String(Date.now())); if(window.__cloudPush) window.__cloudPush(); }
  pushBackup(list,reason); return true; // every save also writes a local snapshot and (when signed in) a Google Drive copy
}
function downloadBlob(blob,name){ const u=URL.createObjectURL(blob); const a=document.createElement('a'); a.href=u; a.download=name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(u),4000); }
async function buildBackup(comparisons,lastRef){ return {app:'vendor-cost-comparison',version:2,ts:Date.now(),lastRef,comparisons}; }
const STATUSES=['Pending','In Progress','Completed'];
const STATUS_CLS={'Pending':'st-pending','In Progress':'st-progress','Completed':'st-done'};

    <input type={type} value={value} placeholder={placeholder} onChange={e=>onChange(e.target.value)} />

function Btn({children,onClick,variant,disabled,title}){
  return <button title={title} className={"btn"+(variant?(' '+variant):'')} onClick={onClick} disabled={disabled}>{children}</button>;
}

// Replaces window.confirm(), which is commonly disabled/silently no-op inside sandboxed
// preview iframes (e.g. an inline artifact viewer) - a blocked confirm() would make
// `if(!confirm(...)) return;` bail out on every call, looking exactly like the action
// being "stuck". This is a real in-page modal instead, so it always actually works.
function ConfirmModal({message, confirmLabel, cancelLabel, danger, onYes, onNo}){
  return <div style={{position:'fixed',inset:0,background:'rgba(17,28,44,0.45)',display:'flex',alignItems:'center',justifyContent:'center',zIndex:1000,padding:20}} onClick={onNo}>
    <div className="card" style={{maxWidth:440,width:'100%',boxShadow:'0 12px 32px rgba(17,28,44,.25)'}} onClick={e=>e.stopPropagation()}>
      <p style={{fontSize:14,color:'#111c2c',lineHeight:1.5,whiteSpace:'pre-wrap',margin:0}}>{message}</p>
      <div style={{display:'flex',justifyContent:'flex-end',gap:8,marginTop:18}}>
        <Btn onClick={onNo}>{cancelLabel||'Cancel'}</Btn>
        <Btn variant={danger?'danger':'primary'} onClick={onYes}>{confirmLabel||'Continue'}</Btn>
      </div>
    </div>
  </div>;
}
function useConfirmDialog(){
  const [state, setState] = useState(null); // {message, resolve}
  const ask = (message) => new Promise(resolve=>{ setState({message, resolve}); });
  const respond = (result) => { setState(s=>{ if(s) s.resolve(result); return null; }); };
  const dialogNode = state ? <ConfirmModal message={state.message} onYes={()=>respond(true)} onNo={()=>respond(false)}/> : null;
  return [ask, dialogNode];
}

/* ---------------- Vendor Cards ---------------- */
const VFIELDS=[['name','Vendor name','e.g. ABC Facility Services'],['type','Vendor type','e.g. External Vendor'],['code','Vendor code','e.g. VEN-001'],
 ['deliveryTimeline','Delivery timeline','e.g. 2 weeks'],['paymentTerms','Payment terms','e.g. 30 days credit'],
 ['quotationValidity','Quotation validity','e.g. 30 days'],['warranty','Warranty details','e.g. 12 months']];

function VendorCards({vendors,onChange,rankByVendorId,quotations,onQuotationUpload,onQuotationRemove,onVendorCountChange}){
  const updateField=(id,key,val)=> onChange(vendors.map(v=>{
    if(v.id!==id) return v;
    if(key==='name'){
      // Only re-default the fee if the user hasn't manually set one for this vendor yet.
      if(!v.feeManual) return {...v, name:val, feePercent: isCBRE(val) ? CBRE_FEE_PCT : 0};
      return {...v, name:val};
    }
    return {...v, [key]:val};
  }));
  const updateFee=(id,raw)=> onChange(vendors.map(v=>{
    if(v.id!==id) return v;
    if(raw===''){ return {...v, feePercent:0, feeManual:true}; }
    const num = safeNum(raw);
    return {...v, feePercent: num<0?0:num, feeManual:true};
  }));
  const resetFeeToDefault=(id)=> onChange(vendors.map(v=> v.id===id ? {...v, feePercent: isCBRE(v.name)?CBRE_FEE_PCT:0, feeManual:false} : v));

  return <div className="card">
    <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',flexWrap:'wrap',gap:12,marginBottom:4}}>
      <div>
        <h2 style={{fontSize:17}}>Vendor details</h2>
        <p className="small" style={{marginTop:4,maxWidth:640}}>Management fee defaults to 3% when a vendor name contains <b>CBRE</b> and 0% otherwise - but it's editable for every vendor. Once you change it manually, the app keeps your value even if you edit the vendor name. Uploaded quotations stay attached to their vendor (and follow it if its L-rank changes) for this browser session, but aren't stored by Save/Load — re-attach them after reopening a comparison.</p>
      </div>
      <div className="field" style={{minWidth:140}}>Number of vendors
        <div className="stepper"><Btn onClick={()=>onVendorCountChange(vendors.length-1)} disabled={vendors.length<=1}>&minus;</Btn><span className="n num">{vendors.length}</span><Btn onClick={()=>onVendorCountChange(vendors.length+1)}>+</Btn><Btn onClick={()=>onVendorCountChange(vendors.length+5)}>+5</Btn></div>
      </div>
    </div>
    <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fill, minmax(240px, 1fr))',gap:16,marginTop:10}}>
      {vendors.map((v,idx)=>{
        const rank = rankByVendorId[v.id];
        const cbre = isCBRE(v.name);
        const q = quotations[v.id];
        return <div key={v.id} className={"vendor-card"+(rank?(' '+rankColorClass(rank)):'')}>
          <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:10}}>
            <span className="pill">Vendor {idx+1}</span>
            <span style={{display:'flex',gap:6}}>
              {cbre && <span className="badge-cbre">CBRE</span>}
              {rank && <span className={"rank-badge rank-"+rankColorClass(rank)}>{rank}</span>}
            </span>
          </div>
          <div style={{display:'flex',flexDirection:'column',gap:8}}>
            {VFIELDS.map(([key,label,ph])=>(
              <label key={key} className="field" style={{textTransform:'none',fontSize:11}}>{label}
                <input value={v[key]} placeholder={ph} onChange={e=>updateField(v.id,key,e.target.value)} />
              </label>
            ))}
            <label className="field" style={{textTransform:'none',fontSize:11}}>
              Management fee %{v.feeManual ? <span style={{fontWeight:400,color:'#8a6d1b'}}> (custom)</span> : <span style={{fontWeight:400,color:'#8c97a6'}}> (default)</span>}
              <div style={{display:'flex',alignItems:'center',gap:6}}>
                <input type="number" min="0" step="0.1" value={v.feePercent??0} onChange={e=>updateFee(v.id,e.target.value)} style={{maxWidth:90}}/>
                <span className="small">%</span>
                {v.feeManual && <button type="button" className="btn" style={{padding:'3px 8px',fontSize:11}} onClick={()=>resetFeeToDefault(v.id)}>Use default</button>}
              </div>
            </label>
            <label className="field" style={{textTransform:'none',fontSize:11}}>Quotation
              {q ? (
                <div style={{display:'flex',alignItems:'center',gap:6,marginTop:3,flexWrap:'wrap'}}>
                  <a href={q.url} target="_blank" rel="noopener noreferrer" style={{fontSize:12,color:'#111c2c',textDecoration:'underline',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap',maxWidth:130}} title={q.name}>📎 {q.name}</a>
                  <label className="btn" style={{padding:'3px 8px',fontSize:11,cursor:'pointer',margin:0}}>
                    Replace
                    <input type="file" style={{display:'none'}} accept=".pdf,.xlsx,.xls,.msg,.eml,.jpg,.jpeg,.png" onChange={e=>e.target.files[0] && onQuotationUpload(v.id, e.target.files[0])}/>
                  </label>
                  <button type="button" className="btn danger" style={{padding:'3px 8px',fontSize:11}} onClick={()=>onQuotationRemove(v.id)}>Remove</button>
                </div>
              ) : (
                <label className="btn" style={{padding:'6px 10px',fontSize:12,cursor:'pointer',display:'inline-block',marginTop:3}}>
                  Upload from Device
                  <input type="file" style={{display:'none'}} accept=".pdf,.xlsx,.xls,.msg,.eml,.jpg,.jpeg,.png" onChange={e=>e.target.files[0] && onQuotationUpload(v.id, e.target.files[0])}/>
                </label>
              )}
            </label>
          </div>
        </div>;
      })}
    </div>
  </div>;
}

const UOMS=['Nos','Mtr','Sqft','Sqm','Job','Kg','Ltr','Set','Lot','Hour','Day','Month'];

function BOQTable({boqLines,vendors,rates,onLines,onRates}){
  const atMax = boqLines.length>=MAX_LINES;
  const updateLine=(id,patch)=> onLines(boqLines.map(l=>l.id===id?{...l,...patch}:l));
  const addLine=(n=1)=>{ onLines([...boqLines,...Array.from({length:n},(_,i)=>({id:uid('boq'),sno:boqLines.length+1+i,description:'',uom:'',qty:null,gstPercent:18}))]); };
  const deleteLine=(id)=>{ const rem=boqLines.filter(l=>l.id!==id).map((l,i)=>({...l,sno:i+1})); onLines(rem.length?rem:boqLines); };
  const setRate=(vId,lId,raw)=>{
    const key=rateKey(vId,lId);
    if(raw.trim()===''){ const n={...rates}; delete n[key]; onRates(n); return; }
    const num=safeNum(raw); onRates({...rates,[key]:num<0?0:num});
  };
  return <div className="card">
    <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',flexWrap:'wrap',gap:10,marginBottom:12}}>
      <div>
        <h2 style={{fontSize:17}}>BOQ &amp; vendor pricing</h2>

        <Btn variant="primary" onClick={()=>addLine(1)}>+ Add BOQ line</Btn><Btn onClick={()=>addLine(5)}>+ Add 5 lines</Btn><Btn onClick={()=>addLine(10)}>+ Add 10 lines</Btn>
      </div>
    </div>
    {atMax && <p className="warn-box" style={{marginBottom:10}}>Maximum 20 BOQ lines allowed.</p>}
    <div style={{overflowX:'auto'}}>
    <table style={{minWidth:1000}}>
      <thead><tr>
        <th style={{textAlign:'center'}}>S.No.</th><th>Item description</th><th>UOM</th><th style={{textAlign:'right'}}>Qty</th><th style={{textAlign:'right'}}>GST %</th>
        {vendors.map((v,i)=><th key={v.id} style={{textAlign:'right'}}>{v.name.trim()||('Vendor '+(i+1))} rate</th>)}
        <th style={{textAlign:'center'}}>Action</th>
      </tr></thead>
      <tbody>
        {boqLines.map(line=>(
          <tr key={line.id}>
            <td className="num" style={{textAlign:'center'}}>{line.sno}</td>
            <td><input value={line.description} placeholder="Please enter an item description" onChange={e=>updateLine(line.id,{description:e.target.value})}/></td>
            <td><input list="uoms" value={line.uom} placeholder="UOM" onChange={e=>updateLine(line.id,{uom:e.target.value})}/></td>
            <td><input type="number" min="0" className="num" style={{textAlign:'right'}} value={line.qty??''} placeholder="Qty" onChange={e=>updateLine(line.id,{qty:e.target.value===''?null:safeNum(e.target.value)})}/></td>
            <td><input type="number" min="0" max="100" className="num" style={{textAlign:'right'}} value={line.gstPercent} onChange={e=>updateLine(line.id,{gstPercent:safeNum(e.target.value)})}/></td>
            {vendors.map(v=>{
              const val = rates[rateKey(v.id,line.id)];
              return <td key={v.id}><input type="number" min="0" className="num" style={{textAlign:'right'}} value={val??''} placeholder="Not quoted" onChange={e=>setRate(v.id,line.id,e.target.value)}/></td>;
            })}
            <td style={{textAlign:'center'}}><Btn variant="danger" disabled={boqLines.length===1} onClick={()=>deleteLine(line.id)}>Delete</Btn></td>
          </tr>
        ))}
      </tbody>
    </table>
    <datalist id="uoms">{UOMS.map(u=><option key={u} value={u}/>)}</datalist>
    </div>
  </div>;
}

/* ---------------- PDF export (redesigned) ---------------- */
function exportPDF(project, refNo, boqLines, ordered){
  const topN = ordered; // all vendors, dynamic count
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({orientation:'landscape',unit:'pt',format:'a4'});
  const pageW = doc.internal.pageSize.getWidth();
  const pageH = doc.internal.pageSize.getHeight();
  const margin = 30;
  const refText = refNo?formatRef(refNo):'Not yet saved';

  const PALETTE = {
    L1:{bg:[223,243,227],tx:[30,122,70],ln:[127,199,154]},
    L2:{bg:[253,243,208],tx:[138,109,27],ln:[228,198,84]},
    L3:{bg:[251,231,198],tx:[138,75,18],ln:[224,165,80]},
    L4:{bg:[219,233,251],tx:[30,77,138],ln:[127,168,224]},
    L5:{bg:[236,227,247],tx:[91,58,138],ln:[183,156,224]},
    L6:{bg:[217,242,239],tx:[20,107,96],ln:[127,207,194]},
    L7:{bg:[251,227,234],tx:[138,44,83],ln:[224,160,187]},
    L8:{bg:[230,233,239],tx:[60,74,94],ln:[169,180,196]},
    L9:{bg:[240,227,213],tx:[122,74,30],ln:[203,163,110]},
    L10:{bg:[225,228,251],tx:[51,54,138],ln:[163,168,230]},
    NR:{bg:[246,247,249],tx:[80,80,80],ln:[200,200,200]},
  };
  const rankColor = (rank)=> PALETTE[rankColorClass(rank)] || PALETTE.NR;

  function drawHeader(){
    doc.setTextColor(17,28,44);
    doc.setFont('helvetica','bold'); doc.setFontSize(17);
    doc.text('COST COMPARISON', margin, 34);
    doc.setDrawColor(17,28,44); doc.setLineWidth(1);
    doc.line(margin, 42, pageW-margin, 42);

    doc.setFont('helvetica','normal'); doc.setFontSize(9.5);
    doc.setTextColor(80,90,105);
    const meta = [
      ['Activity Name', project.activityName || '-'],
      ['Comparison Reference No.', refText],
      ['Comparison Date', project.comparisonDate || '-'],
      ['Prepared By', project.preparedBy || '-'],
    ];
    let mx = margin, my = 56;
    meta.forEach(([label,val],i)=>{
      doc.setFont('helvetica','bold'); doc.setTextColor(17,28,44);
      doc.text(label+':', mx, my);
      doc.setFont('helvetica','normal'); doc.setTextColor(80,90,105);
      doc.text(String(val), mx, my+12);
      mx += (pageW - margin*2)/4;
    });
    return 82;
  }

  function drawVendorSummary(y){
    // Wraps to additional rows once vendors no longer fit comfortably in one row
    // (roughly 6 per row at this page width) - keeps each box legible at higher vendor counts.
    const perRow = Math.max(1, Math.min(topN.length, Math.floor((pageW-margin*2+10)/130)));
    const gap=10, w=(pageW-margin*2-gap*(perRow-1))/perRow;
    const boxH = 38, rowGap = 8;
    topN.forEach((r,i)=>{
      const col = i % perRow, rowI = Math.floor(i/perRow);
      const x = margin + col*(w+gap);
      const by = y + rowI*(boxH+rowGap);
      const c = rankColor(r.rank);
      doc.setFillColor(...c.bg); doc.setDrawColor(...c.ln); doc.setLineWidth(1);
      doc.roundedRect(x,by,w,boxH,4,4,'FD');
      doc.setTextColor(...c.tx); doc.setFont('helvetica','bold'); doc.setFontSize(9);
      doc.text((r.rank==='NR'?'NOT RANKED':r.rank)+(r.isTie?' (TIE)':''), x+10, by+15);
      doc.setFont('helvetica','normal'); doc.setFontSize(10); doc.setTextColor(17,28,44);
      const nameMax = Math.floor(w/5.2);
      let name = r.vendor.name.trim()||'-';
      if(name.length>nameMax) name = name.slice(0,nameMax-1)+'…';
      doc.text(name, x+10, by+30);
      if(r.rank==='L1' && w>110){
        doc.setFont('helvetica','bold'); doc.setFontSize(7); doc.setTextColor(...c.tx);
        doc.text('SELECTED', x+w-46, by+15);
      }
    });
    const rows = Math.ceil(topN.length/perRow);
    return y + rows*(boxH+rowGap) + 8;
  }

  let y = drawHeader();
  y = drawVendorSummary(y);

  // BOQ table
  const head = [
    [
      {content:'S.No.',rowSpan:2,styles:{halign:'center',valign:'middle'}},
      {content:'Item Description',rowSpan:2,styles:{valign:'middle'}},
      {content:'UOM',rowSpan:2,styles:{halign:'center',valign:'middle'}},
      {content:'Qty',rowSpan:2,styles:{halign:'center',valign:'middle'}},
      {content:'GST %',rowSpan:2,styles:{halign:'center',valign:'middle'}},
      ...topN.map(r=>{ const c=rankColor(r.rank); return {content:(r.rank==='NR'?'NR':r.rank)+' - '+(r.vendor.name.trim()||'-'),colSpan:2,styles:{halign:'center',fillColor:c.bg,textColor:c.tx}}; })
    ],
    [...topN.flatMap(r=>{ const c=rankColor(r.rank); return [
      {content:'Rate',styles:{halign:'right',fillColor:c.bg,textColor:c.tx,fontStyle:'normal'}},
      {content:'Amount',styles:{halign:'right',fillColor:c.bg,textColor:c.tx,fontStyle:'normal'}},
    ]; })]
  ];
  const body = boqLines.map(line=>{
    const row=[line.sno, line.description||'-', line.uom||'-', line.qty??'-', (line.gstPercent+'%')];
    topN.forEach(r=>{
      const lr = r.lines.find(l=>l.lineId===line.id);
      row.push(lr && lr.rate!==null ? formatINRPdf(lr.rate) : '-');
      row.push(lr && lr.amount!==null ? formatINRPdf(lr.amount) : 'Not Quoted');
    });
    return row;
  });
  const subTotalRow = [{content:'Sub-Total',colSpan:5,styles:{halign:'right',fontStyle:'bold'}}];
  topN.forEach(r=> subTotalRow.push({content:formatINRPdf(r.basicSubtotal),colSpan:2,styles:{halign:'right'}}));
  body.push(subTotalRow);
  const feePctRow = [{content:'Management Fee %',colSpan:5,styles:{halign:'right',fontStyle:'bold'}}];
  topN.forEach(r=> feePctRow.push({content:r.managementFeePercent+'%',colSpan:2,styles:{halign:'right'}}));
  body.push(feePctRow);
  const summaryRows = [
    ['Management Fee Amount', r=>r.managementFee],
    ['Taxable Amount', r=>r.taxableAmount],
    ['GST', r=>r.gstAmount],
  ];
  summaryRows.forEach(([label,get])=>{
    const row=[{content:label,colSpan:5,styles:{halign:'right',fontStyle:'bold'}}];
    topN.forEach(r=> row.push({content:formatINRPdf(get(r)),colSpan:2,styles:{halign:'right'}}));
    body.push(row);
  });
  body.push([
    {content:'Grand Total',colSpan:5,styles:{halign:'right',fontStyle:'bold',textColor:255,fillColor:[17,28,44]}},
    ...topN.map(r=>{ const c=rankColor(r.rank); return {content:formatINRPdf(r.grandTotal),colSpan:2,styles:{halign:'right',fontStyle:'bold',textColor:255,fillColor:c.tx}}; })
  ]);

  doc.autoTable({
    startY:y, margin:{left:margin,right:margin,bottom:46},
    head, body, theme:'grid',
    styles:{font:'helvetica',fontSize:topN.length>6?7:8,cellPadding:topN.length>6?3:4,valign:'middle',lineColor:[210,216,224],lineWidth:.5,textColor:[30,38,50]},
    headStyles:{fillColor:[246,247,249],textColor:[60,70,85],fontStyle:'bold',halign:'center'},
    alternateRowStyles:{fillColor:[250,251,252]},
    columnStyles:{0:{halign:'center',cellWidth:26},2:{halign:'center',cellWidth:28},3:{halign:'center',cellWidth:28},4:{halign:'center',cellWidth:28}},
    showHead:'everyPage',
    didParseCell:(d)=>{ if(d.column.index>=5 && d.section==='body') d.cell.styles.halign='right'; }
  });

  let afterY = doc.lastAutoTable.finalY + 20;
  if(afterY > pageH - 130){ doc.addPage(); afterY = 40; }

  const l1 = topN.find(r=>r.rank==='L1');
  doc.setFont('helvetica','bold'); doc.setFontSize(11); doc.setTextColor(17,28,44);
  doc.text('SELECTED VENDOR - L1', margin, afterY);
  if(l1){
    const c = rankColor('L1');
    doc.setFillColor(...c.bg); doc.setDrawColor(...c.ln);
    doc.roundedRect(margin, afterY+8, pageW-margin*2, 60, 4, 4, 'FD');
    const cols = [
      ['Vendor Name', l1.vendor.name||'-'],
      ['Vendor Code', l1.vendor.code||'-'],
      ['Delivery Timeline', l1.vendor.deliveryTimeline||'-'],
      ['Payment Terms', l1.vendor.paymentTerms||'-'],
      ['Quotation Validity', l1.vendor.quotationValidity||'-'],
      ['Warranty Details', l1.vendor.warranty||'-'],
    ];
    const cw = (pageW-margin*2-20)/3;
    cols.forEach(([label,val],i)=>{
      const cx = margin+10 + (i%3)*cw;
      const cy = afterY+24 + Math.floor(i/3)*26;
      doc.setFont('helvetica','bold'); doc.setFontSize(8); doc.setTextColor(...c.tx);
      doc.text(label, cx, cy);
      doc.setFont('helvetica','normal'); doc.setFontSize(9.5); doc.setTextColor(17,28,44);
      doc.text(String(val), cx, cy+12);
    });
    afterY += 8+60+14;
  } else {
    doc.setFont('helvetica','normal'); doc.setFontSize(9); doc.setTextColor(120,120,120);
    doc.text('No vendor currently qualifies as the selected vendor (L1).', margin, afterY+16);
  }

  // footer on every page
  const pageCount = doc.getNumberOfPages();
  for(let i=1;i<=pageCount;i++){
    doc.setPage(i);
    doc.setDrawColor(210,216,224); doc.setLineWidth(.5);
    doc.line(margin, pageH-26, pageW-margin, pageH-26);
    doc.setFont('helvetica','normal'); doc.setFontSize(8); doc.setTextColor(120,130,145);
    doc.text('Cost Comparison - '+refText, margin, pageH-14);
    doc.text('Page '+i+' of '+pageCount, pageW-margin, pageH-14, {align:'right'});
  }

  const dateStr = (project.comparisonDate||new Date().toISOString().slice(0,10)).replace(/-/g,'');
  const slug = (project.activityName||'Comparison').replace(/[^a-z0-9]+/gi,'_').replace(/^_+|_+$/g,'');
  doc.save('Cost_Comparison_'+slug+'_'+dateStr+'.pdf');
}

function colLetter(n){ // 1-indexed -> 'A','B',...
  let s=''; while(n>0){ const m=(n-1)%26; s=String.fromCharCode(65+m)+s; n=Math.floor((n-1)/26); } return s;
}

async function buildCostComparisonWorkbook(project, refNo, boqLines, ordered, quotationFiles, opts){
  const forZip = !!(opts && opts.forZip);
  const topN = ordered; // all vendors, dynamic count (not capped at 3)
  const refText = refNo?formatRef(refNo):'Not yet saved';
  const l1 = topN.find(r=>r.rank==='L1');

  const workbook = await XlsxPopulate.fromBlankAsync();
  const sheet = workbook.sheet(0);
  sheet.name('Cost Comparison');

  const TOTAL_COLS = 5 + topN.length*2; // S.No, Description, UOM, Qty, GST%, then (Rate, Amount) per vendor - dynamic count

  const cell = (r,c)=> sheet.cell(r,c);
  const merge = (r1,c1,r2,c2)=> sheet.range(r1,c1,r2,c2).merged(true);
  const THIN='9AA5B4', MED='111C2C';
  // Vendor blocks are 2 cols each, starting at column 6. Dynamic for any vendor count.
  const blockStarts = [1, ...topN.map((_,vi)=>6+vi*2)];
  const blockEnds = [5, ...topN.map((_,vi)=>7+vi*2)];
  const isBlockStart = (c)=> blockStarts.includes(c);
  const isBlockEnd = (c)=> blockEnds.includes(c);
  // Always writes the full 4-side border object in one call per cell (never a partial
  // side-only object), so a later call can't silently wipe sides an earlier call set -
  // xlsx-populate treats `style('border', obj)` as replacing the whole border, not merging.
  const applyGridBorders = (r1,c1,r2,c2)=>{
    for(let r=r1;r<=r2;r++){
      for(let c=c1;c<=c2;c++){
        cell(r,c).style('border',{
          top:{style:(r===r1)?'medium':'thin', color:(r===r1)?MED:THIN},
          bottom:{style:(r===r2)?'medium':'thin', color:(r===r2)?MED:THIN},
          left:{style:isBlockStart(c)?'medium':'thin', color:isBlockStart(c)?MED:THIN},
          right:{style:isBlockEnd(c)?'medium':'thin', color:isBlockEnd(c)?MED:THIN},
        });
      }
    }
  };

  let row = 1;

  // ---- Title & header meta ----
  cell(row,1).value('COST COMPARISON').style({bold:true,fontSize:16,fontColor:'FFFFFF',fill:'111C2C',verticalAlignment:'center'});
  merge(row,1,row,TOTAL_COLS); sheet.row(row).height(26); row++;

  const metaRows=[['Reference No.:',refText],['Activity:',project.activityName||'-'],['Selected Vendor (L1):',l1?(l1.vendor.name||'-'):'-'],
    ['Comparison Date:',project.comparisonDate||'-'],['Prepared By:',project.preparedBy||'-'],['Status:',project.status||'Pending']];
  metaRows.forEach(([label,val])=>{
    cell(row,1).value(label).style({bold:true});
    cell(row,2).value(val);
    merge(row,2,row,5);
    row++;
  });
  row++;

  cell(row,1).value(project.activityName || '-').style({bold:true,fontSize:12,wrapText:true});
  merge(row,1,row,TOTAL_COLS); row++;

  // ---- BOQ two-row header ----
  const headerRow1 = row, headerRow2 = row+1;
  const baseHeaders=['S.No.','Item Description','UOM','Qty','GST %'];
  baseHeaders.forEach((h,i)=>{
    const c=i+1;
    cell(headerRow1,c).value(h).style({bold:true,fill:XL_GREY.bg,fontColor:XL_GREY.text,horizontalAlignment:'center',verticalAlignment:'center',wrapText:true,border:true});
    merge(headerRow1,c,headerRow2,c);
  });
  topN.forEach((r,vi)=>{
    const startCol = 6 + vi*2; // F,H,J
    const colr = xlColorFor(r.rank);
    const label = (r.rank==='NR'?'NR':r.rank)+' - '+(r.vendor.name.trim()||'-');
    cell(headerRow1,startCol).value(label).style({bold:true,fill:colr.bg,fontColor:colr.text,horizontalAlignment:'center',verticalAlignment:'center',wrapText:true,border:true});
    merge(headerRow1,startCol,headerRow1,startCol+1);
    ['Rate','Amount'].forEach((sub,j)=>{
      cell(headerRow2,startCol+j).value(sub).style({bold:true,fill:colr.bg,fontColor:colr.text,horizontalAlignment:'center',verticalAlignment:'center',border:true});
    });
  });
  row = headerRow2+1;

  // ---- Data rows (with live formulas) ----
  const dataStart = row;
  boqLines.forEach(line=>{
    const r = row;
    cell(r,1).value(line.sno).style({horizontalAlignment:'center',border:true});
    cell(r,2).value(line.description||'-').style({wrapText:true,verticalAlignment:'top',border:true});
    cell(r,3).value(line.uom||'-').style({horizontalAlignment:'center',border:true});
    cell(r,4).value(line.qty===null||line.qty===undefined?'':line.qty).style({horizontalAlignment:'center',border:true});
    cell(r,5).value((line.gstPercent||0)/100).style({horizontalAlignment:'center',numberFormat:PCT_FMT,border:true});
    const D=colLetter(4);
    topN.forEach((res,vi)=>{
      const rateCol=6+vi*2, amtCol=rateCol+1;
      const F=colLetter(rateCol);
      const lr = res.lines.find(l=>l.lineId===line.id);
      cell(r,rateCol).value(lr&&lr.rate!==null?lr.rate:'').style({numberFormat:MONEY_FMT,horizontalAlignment:'right',border:true});
      cell(r,amtCol).formula('IF(OR('+D+r+'="",'+F+r+'=""),"",'+D+r+'*'+F+r+')').style({numberFormat:MONEY_FMT,horizontalAlignment:'right',border:true});
    });
    row++;
  });
  const dataEnd = row-1;
  row++; // spacer

  // ---- Cost summary ----
  cell(row,1).value('Cost Summary').style({bold:true,fontSize:12});
  merge(row,1,row,TOTAL_COLS); row++;

  const summaryHeaderRow = row;
  cell(row,1).value('Cost Component').style({bold:true,fill:XL_GREY.bg,fontColor:XL_GREY.text,border:true});
  merge(row,1,row,5);
  topN.forEach((r,vi)=>{
    const startCol=6+vi*2, colr=xlColorFor(r.rank);
    cell(row,startCol).value((r.rank==='NR'?'NR':r.rank)+' - '+(r.vendor.name.trim()||'-')).style({bold:true,fill:colr.bg,fontColor:colr.text,horizontalAlignment:'center',border:true});
    merge(row,startCol,row,startCol+1);
  });
  row++;

  function summaryLabelRow(label, bold){
    cell(row,1).value(label).style({bold:!!bold});
    merge(row,1,row,5);
  }

  const subTotalRow = row;
  summaryLabelRow('BOQ Subtotal', true);
  topN.forEach((r,vi)=>{
    const startCol=6+vi*2, amtCol=startCol+1;
    const Gc=colLetter(amtCol);
    cell(row,startCol).formula('SUM('+Gc+dataStart+':'+Gc+dataEnd+')').style({bold:true,numberFormat:MONEY_FMT,horizontalAlignment:'right',fill:xlColorFor(r.rank).bg});
    merge(row,startCol,row,startCol+1);
  });
  row++;

  const feePctRow = row;
  summaryLabelRow('CBRE Management Fee %');
  topN.forEach((r,vi)=>{
    const startCol=6+vi*2;
    const c = cell(row,startCol);
    // Fee is now freely editable per vendor (not locked to CBRE) - always reflect the
    // vendor's actual final percentage, whatever it was set to.
    c.value(r.managementFeePercent/100).style({numberFormat:PCT_FMT,horizontalAlignment:'right',fill:xlColorFor(r.rank).bg});
    merge(row,startCol,row,startCol+1);
    try{ c.dataValidation({type:'decimal',operator:'greaterThanOrEqual',formula1:'0',allowBlank:true,error:'Enter a percentage of 0 or more.'}); }catch(e){ /* validation is a convenience only - value above is still correct either way */ }
  });
  row++;

  const feeAmtRow = row;
  summaryLabelRow('CBRE Management Fee Amount');
  topN.forEach((r,vi)=>{
    const startCol=6+vi*2;
    const S=colLetter(startCol);
    cell(row,startCol).formula(S+subTotalRow+'*'+S+feePctRow).style({numberFormat:MONEY_FMT,horizontalAlignment:'right',fill:xlColorFor(r.rank).bg});
    merge(row,startCol,row,startCol+1);
  });
  row++;

  const taxableRow = row;
  summaryLabelRow('Taxable Amount', true);
  topN.forEach((r,vi)=>{
    const startCol=6+vi*2;
    const S=colLetter(startCol);
    cell(row,startCol).formula(S+subTotalRow+'+'+S+feeAmtRow).style({bold:true,numberFormat:MONEY_FMT,horizontalAlignment:'right',fill:xlColorFor(r.rank).bg});
    merge(row,startCol,row,startCol+1);
  });
  row++;

  const gstPctRow = row;
  summaryLabelRow('GST %');
  topN.forEach((r,vi)=>{
    const startCol=6+vi*2;
    const E=colLetter(5);
    // A plain reference to the first BOQ line's GST% cell - not a multi-cell array
    // formula - so it behaves identically whether there's 1 line or 20. BOQ items
    // share one configured GST rate in the common case; if lines do carry different
    // rates, this shows the first line's rate as the comparison-level reference rate.
    cell(row,startCol).formula('$'+E+'$'+dataStart).style({numberFormat:PCT_FMT,horizontalAlignment:'right',fill:xlColorFor(r.rank).bg});
    merge(row,startCol,row,startCol+1);
  });
  row++;

  const gstAmtRow = row;
  summaryLabelRow('GST Amount', true);
  topN.forEach((r,vi)=>{
    const startCol=6+vi*2;
    const S=colLetter(startCol), E=colLetter(5);
    // GST Amount = Taxable Amount x GST% - a single-level multiplication referencing
    // only two plain cells, so it never depends on how many BOQ rows exist.
    cell(row,startCol).formula(S+taxableRow+'*$'+E+'$'+dataStart).style({bold:true,numberFormat:MONEY_FMT,horizontalAlignment:'right',fill:xlColorFor(r.rank).bg});
    merge(row,startCol,row,startCol+1);
  });
  row++;

  const grandTotalRow = row;
  cell(row,1).value('Grand Total').style({bold:true,fill:'111C2C',fontColor:'FFFFFF'});
  merge(row,1,row,5);
  topN.forEach((r,vi)=>{
    const startCol=6+vi*2;
    const S=colLetter(startCol);
    cell(row,startCol).formula(S+taxableRow+'+'+S+gstAmtRow).style({bold:true,fontSize:12,numberFormat:MONEY_FMT,horizontalAlignment:'right',fontColor:'FFFFFF',fill:r.rank==='L1'?'1E7A46':r.rank==='L2'?'8A6D1B':r.rank==='L3'?'8A4B12':'505A69'});
    merge(row,startCol,row,startCol+1);
  });
  sheet.row(row).height(20);
  row+=2;

  // ---- Selected vendor (L1 only) ----
  cell(row,1).value('SELECTED VENDOR – L1').style({bold:true,fontSize:12,fill:XL_GREEN.bg,fontColor:XL_GREEN.text});
  merge(row,1,row,TOTAL_COLS); row++;
  if(l1){
    const fields=[['Vendor Name',l1.vendor.name],['Vendor Code',l1.vendor.code],['Delivery Timeline',l1.vendor.deliveryTimeline],
      ['Payment Terms',l1.vendor.paymentTerms],['Quotation Validity',l1.vendor.quotationValidity],['Warranty Details',l1.vendor.warranty]];
    fields.forEach(([label,val])=>{
      cell(row,1).value(label).style({bold:true});
      cell(row,2).value(val||'-').style({wrapText:true,verticalAlignment:'top'});
      merge(row,2,row,6);
      row++;
    });
  } else {
    cell(row,1).value('No vendor currently qualifies as the selected vendor (L1).');
    merge(row,1,row,TOTAL_COLS); row++;
  }
  row++;

  // ---- Vendor Quotations (bottom section - does not touch the BOQ table or Cost
  // Summary above it, own formatting only). The whole section is OMITTED when nothing
  // has been uploaded for any vendor, and when it is shown, only vendors that actually
  // have a file get a row - no blank/placeholder rows for the others. Links are
  // relative paths ("L1/filename.pdf") that resolve when this workbook is kept
  // alongside its L1/L2/L3 folders, i.e. when it's part of the "Export Complete ZIP"
  // package - a plain hyperlink can't reach into a file that only exists in the
  // browser tab that's exporting it. ----
  const vendorsWithQuotes = topN.filter(r => quotationFiles && quotationFiles[r.vendor.id]);
  let quotationSectionRow = null;
  if(vendorsWithQuotes.length > 0){
    quotationSectionRow = row;
    cell(row,1).value('VENDOR QUOTATIONS').style({bold:true,fontSize:12,fill:XL_GREY.bg,fontColor:XL_GREY.text,border:true});
    merge(row,1,row,TOTAL_COLS); row++;
    cell(row,1).value('Vendor').style({bold:true,border:true,fill:XL_GREY.bg,fontColor:XL_GREY.text});
    merge(row,1,row,5);
    cell(row,6).value('Quotation').style({bold:true,border:true,fill:XL_GREY.bg,fontColor:XL_GREY.text});
    merge(row,6,row,TOTAL_COLS); row++;
    vendorsWithQuotes.forEach(r=>{
      cell(row,1).value((r.rank==='NR'?'NR':r.rank)+' - '+(r.vendor.name.trim()||'-')).style({border:true});
      merge(row,1,row,5);
      const qCell = cell(row,6);
      const file = quotationFiles[r.vendor.id];
      const safe = sanitizeFilename(file.name);
      const relPath = (r.rank==='L1'||r.rank==='L2'||r.rank==='L3') ? (r.rank+'/'+safe) : safe;
      qCell.value(safe).style(forZip?{border:true,fontColor:'1155CC',underline:true}:{border:true});
      if(forZip){ try{ qCell.hyperlink(relPath); }catch(e){ /* hyperlink is best-effort; filename still shown */ } }
      merge(row,6,row,TOTAL_COLS);
      row++;
    });
    if(forZip){
      cell(row,1).value('Links resolve when this workbook is kept together with its L1/L2/L3 quotation folders (from "Export Complete ZIP").')
        .style({italic:true,fontColor:'8C97A6',fontSize:8});
      merge(row,1,row,TOTAL_COLS); row++;
    } else {
      cell(row,1).value('Quotation filenames are shown for reference. Use "Export Complete ZIP" to get an Excel with working links plus the actual attached files.')
        .style({italic:true,fontColor:'8C97A6',fontSize:8});
      merge(row,1,row,TOTAL_COLS); row++;
    }
  }

  // ---- Grid borders: medium between vendor blocks (and around the S.No/Desc/UOM/Qty/GST
  // block), thin everywhere else - applied once, after all cells/merges exist, so nothing
  // gets partially overwritten. ----
  applyGridBorders(headerRow1, 1, dataEnd, TOTAL_COLS);
  applyGridBorders(summaryHeaderRow, 1, grandTotalRow, TOTAL_COLS);
  if(quotationSectionRow !== null){
    applyGridBorders(quotationSectionRow, 1, quotationSectionRow+1+vendorsWithQuotes.length, TOTAL_COLS);
  }

  // ---- Column widths (never exceed 50) + wrap text on long-content columns ----
  sheet.column(1).width(clampWidth(7));
  sheet.column(2).width(clampWidth(38)); // Item Description - wraps rather than growing past 50
  sheet.column(3).width(clampWidth(8));
  sheet.column(4).width(clampWidth(8));
  sheet.column(5).width(clampWidth(9));
  topN.forEach((r,vi)=>{
    const startCol=6+vi*2;
    sheet.column(startCol).width(clampWidth(13));
    sheet.column(startCol+1).width(clampWidth(14));
  });

  // ---- Freeze header rows so BOQ/vendor headers stay visible while scrolling ----
  try{ sheet.freezePanes(0, headerRow2); }catch(e){ /* not critical */ }

  // ---- Best-effort print setup: A4 landscape, fit to 1 page wide, repeat header rows ----
  try{
    sheet._node.children.push({name:'pageSetup',children:[],attributes:{paperSize:'9',orientation:'landscape',fitToWidth:'1',fitToHeight:'0'}});
    sheet._sheetPrNode = sheet._sheetPrNode || {name:'sheetPr',children:[],attributes:{}};
    sheet._sheetPrNode.children.push({name:'pageSetUpPr',children:[],attributes:{fitToPage:'1'}});
  }catch(e){ /* print setup is best-effort - the workbook is still fully correct without it */ }
  try{ workbook.definedName('_xlnm.Print_Titles', "'Cost Comparison'!$1:$"+headerRow2); }catch(e){ /* not critical */ }

  // ---- Force a full recalculation when the workbook is opened. xlsx-populate writes
  // formulas but not cached results, so without this flag some Excel versions can show
  // blank/stale values in formula cells (especially ones that reference other formula
  // cells) until the user manually recalculates (F9). ----
  try{
    const wbNode = workbook._node;
    let calcPr = wbNode.children.find(c=>c.name==='calcPr');
    if(!calcPr){ calcPr = {name:'calcPr',children:[],attributes:{}}; wbNode.children.push(calcPr); }
    calcPr.attributes.calcId = '0';
    calcPr.attributes.fullCalcOnLoad = '1';
    calcPr.attributes.forceFullCalc = '1';
  }catch(e){ /* best effort - formulas are still correct even if this doesn't apply */ }

  const dateStr=(project.comparisonDate||new Date().toISOString().slice(0,10)).replace(/-/g,'');
  const slug=(project.activityName||'Comparison').replace(/[^a-z0-9]+/gi,'_').replace(/^_+|_+$/g,'');
  const filename = 'Cost_Comparison_'+slug+'_'+dateStr+'.xlsx';

  return {workbook, filename};
}

/** Standalone "Export Excel" button: builds the workbook (no quotation files passed,
 * since without the ZIP there's nowhere for a relative link to resolve to) and
 * downloads it directly. */
async function exportExcel(project, refNo, boqLines, ordered, quotationFiles){
  const {workbook, filename} = await buildCostComparisonWorkbook(project, refNo, boqLines, ordered, quotationFiles||{}, {forZip:false});
  const blob = await workbook.outputAsync();
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url), 4000);
}

function quotationFilesOnly(quotations){
  const out={};
  Object.keys(quotations||{}).forEach(id=>{ if(quotations[id] && quotations[id].file) out[id]=quotations[id].file; });
  return out;
}

function sanitizeFilename(name){
  return String(name||'file').replace(/[\\/:*?"<>|]+/g,'_').trim() || 'file';
}

/**
 * Exports a single ZIP containing the same Excel workbook plus L1/L2/L3 folders
 * holding each vendor's uploaded quotation (if any) - additive to, not a
 * replacement for, the plain "Export Excel" / "Export PDF" buttons.
 */
async function exportZip(project, refNo, boqLines, ordered, quotationFiles){
  const {workbook} = await buildCostComparisonWorkbook(project, refNo, boqLines, ordered, quotationFiles||{}, {forZip:true});
  const xlsxBlob = await workbook.outputAsync();
  const refText = refNo?formatRef(refNo):'Draft';
  const xlsxFilename = 'Cost_Comparison_'+refText+'.xlsx';

  const zip = new JSZip();
  // `ordered` is recomputed (via useMemo, from the live comp.vendors/boqLines/rates) on
  // every render and passed in fresh at click-time - it is never a cached/stale ranking.
  // Each vendor's quotation file is looked up by vendor.id (stable per vendor, independent
  // of vendor count or slot position) and placed into THAT vendor's rank *right now* - so
  // if pricing changes flip who is L1, the very next ZIP export puts each file in its
  // vendor's new folder, not its old one. Exactly one folder receives each file.
  //
  // Dynamic for any vendor count (1-10+): folders are created on demand per rank actually
  // present in `ordered`, covering every ranked vendor - not a fixed L1/L2/L3 slice that
  // would silently drop vendors 4+ once vendor count became configurable.
  const folderCache = {};
  const getFolder = (rankLabel) => {
    if(!folderCache[rankLabel]) folderCache[rankLabel] = zip.folder(rankLabel);
    return folderCache[rankLabel];
  };
  for(const r of ordered){
    if(r.rank==='NR') continue; // incomplete quote has no L-rank folder to place a file in
    const folder = getFolder(r.rank); // r.rank is this vendor's CURRENT rank, computed just now
    const file = quotationFiles && quotationFiles[r.vendor.id];
    if(file){
      const buf = await file.arrayBuffer();
      folder.file(sanitizeFilename(file.name), buf);
    }
    // no file -> folder stays present but empty, exactly as specced
  }
  zip.file(xlsxFilename, xlsxBlob);

  const zipBlob = await zip.generateAsync({type:'blob'});
  const zipName = 'Cost_Comparison_'+refText+'.zip';
  const url = URL.createObjectURL(zipBlob);
  const a = document.createElement('a');
  a.href = url; a.download = zipName;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url), 4000);
}

/* ---------------- Editor ---------------- */
function Editor({initial, onBack, onSaved}){
  const [comp, setComp] = useState(initial);
  const [dirty, setDirty] = useState(false);
  const [showValidation, setShowValidation] = useState(false);
  const [excelBusy, setExcelBusy] = useState(false);
  const [excelError, setExcelError] = useState(null);
  const [zipBusy, setZipBusy] = useState(false);
  const [zipError, setZipError] = useState(null);
  const [quotations, setQuotations] = useState({}); // {vendorId: {file, name, url}} - in-memory for this session only
  const [confirmAsync, confirmDialog] = useConfirmDialog();

  const handleQuotationUpload = (vendorId, file) => {
    setQuotations(q=>{
      const prev = q[vendorId];
      if(prev && prev.url) URL.revokeObjectURL(prev.url);
      return {...q, [vendorId]: {file, name: file.name, url: URL.createObjectURL(file)}};
    });
  };
  const handleQuotationRemove = (vendorId) => {
    setQuotations(q=>{
      const prev = q[vendorId];
      if(prev && prev.url) URL.revokeObjectURL(prev.url);
      const next = {...q}; delete next[vendorId]; return next;
    });
  };

  const setVendorCount = async (rawN) => {
    const n = Math.max(1, Math.floor(safeNum(rawN))); // no cap on vendors
    const current = comp.vendors;
    if(n === current.length) return;
    if(n < current.length){
      const removed = current.slice(n);
      const hasData = removed.some(v => v.name.trim()!=='' || quotations[v.id]);
      if(hasData){
        const names = removed.map(v=>v.name.trim()||'(unnamed)').join(', ');
        const ok = await confirmAsync('Reducing to '+n+' vendor'+(n===1?'':'s')+' will remove: '+names+'. Continue?');
        if(!ok) return;
      }
      const keepIds = new Set(current.slice(0,n).map(v=>v.id));
      const nextRates = {...comp.rates};
      Object.keys(nextRates).forEach(k=>{ const vId=k.split('::')[0]; if(!keepIds.has(vId)) delete nextRates[k]; });
      setQuotations(q=>{
        const next={...q};
        removed.forEach(v=>{ if(next[v.id]){ if(next[v.id].url) URL.revokeObjectURL(next[v.id].url); delete next[v.id]; } });
        return next;
      });
      mutate({vendors: current.slice(0,n), rates: nextRates});
    } else {
      const additions = [];
      for(let i=current.length; i<n; i++){
        additions.push({id:uid('vendor'), name:'', type:'', code:'', deliveryTimeline:'', paymentTerms:'', quotationValidity:'', warranty:'', feePercent:0, feeManual:false});
      }
      mutate({vendors:[...current, ...additions]});
    }
  };

  const results = useMemo(()=> comp.vendors.map(v=>computeVendorResult(v,comp.boqLines,comp.rates)), [comp.vendors,comp.boqLines,comp.rates]);
  const ordered = useMemo(()=> exportOrder(results), [results]);
  const rankByVendorId = useMemo(()=>{ const m={}; ordered.forEach(r=>m[r.vendor.id]=r.rank); return m; }, [ordered]);
  const l1 = ordered.find(r=>r.rank==='L1');

  const mutate = (patch) => { setComp(c=>({...c,...patch})); setDirty(true); };
  const setLines = (v) => mutate({boqLines:v});

  const issues = useMemo(()=>{
    const list=[];
    comp.boqLines.forEach(l=>{
      if(l.description.trim()==='') list.push('Line '+l.sno+': please enter an item description.');
      if(l.uom.trim()==='') list.push('Line '+l.sno+': please select or enter a UOM.');
      if(l.qty===null||l.qty<=0) list.push('Line '+l.sno+': please enter a valid quantity greater than zero.');
      if(l.gstPercent<0||l.gstPercent>100) list.push('Line '+l.sno+': GST % must be between 0 and 100.');
    });
    comp.vendors.forEach((v,i)=>{ if(v.name.trim()==='') list.push('Vendor '+(i+1)+': please enter a vendor name.'); });
    return list;
  },[comp]);

  const handleBack = async () => {
    if(dirty){
      const ok = await confirmAsync('You have unsaved changes. Leave without saving?');
      if(!ok) return;
    }
    onBack();
  };
  const handleSave = () => { const saved = onSaved(comp); if(saved) setComp(saved); setDirty(false); };
  const handleExportExcel = () => {
    setShowValidation(true); setExcelError(null); setExcelBusy(true);
    exportExcel(comp.project, comp.refNo, comp.boqLines, ordered, quotationFilesOnly(quotations))
      .catch(err=>{ console.error(err); setExcelError('Excel export failed: '+(err && err.message ? err.message : 'unknown error')); })
      .finally(()=>setExcelBusy(false));
  };
  const handleExportPDF = () => { setShowValidation(true); exportPDF(comp.project, comp.refNo, comp.boqLines, ordered); };
  const handleExportZip = () => {
    setShowValidation(true); setZipError(null); setZipBusy(true);
    exportZip(comp.project, comp.refNo, comp.boqLines, ordered, quotationFilesOnly(quotations))
      .catch(err=>{ console.error(err); setZipError('ZIP export failed: '+(err && err.message ? err.message : 'unknown error')); })
      .finally(()=>setZipBusy(false));
  };

  return <div>
    <div className="topbar">
      <div className="container topbar-inner">
        <div style={{display:'flex',alignItems:'center',gap:14}}>
          <Btn onClick={handleBack}>&larr; Dashboard</Btn>
          <div>
            <div style={{fontWeight:700}}>{comp.refNo?formatRef(comp.refNo):'New comparison'}</div>
            <div className="small">{comp.refNo?'Saved':'Not yet saved — will become '+formatRef(loadLastRef()+1)+' on Save'}</div>
          </div>
        </div>
        <div style={{display:'flex',gap:8,flexWrap:'wrap'}}>
          <Btn onClick={async ()=>{ if(comp.boqLines.some(l=>l.description.trim()!=='')){ const ok = await confirmAsync('Replace current entries with sample data?'); if(!ok) return; } mutate(sampleState()); }}>Load sample</Btn>
          <Btn onClick={async ()=>{ const ok = await confirmAsync('Clear this comparison? This cannot be undone.'); if(!ok) return; setComp({...blankState(), refNo:comp.refNo, isSaved:comp.isSaved}); setDirty(true); Object.values(quotations).forEach(q=>q.url&&URL.revokeObjectURL(q.url)); setQuotations({}); }} variant="danger">Reset</Btn>
          <Btn onClick={()=>window.print()}>Preview / Print</Btn>
          <Btn variant="primary" onClick={handleExportExcel} disabled={excelBusy}>{excelBusy?'Building Excel…':'Export Excel'}</Btn>
          <Btn variant="primary" onClick={handleExportPDF}>Export PDF</Btn>
          <Btn onClick={handleExportZip} disabled={zipBusy}>{zipBusy?'Building ZIP…':'Export Complete Package (.ZIP)'}</Btn>
          <Btn variant="primary" onClick={handleSave}>Save</Btn>
        </div>
      </div>
    </div>

    <div className="container" style={{paddingTop:20,paddingBottom:60,display:'flex',flexDirection:'column',gap:18}}>
      {showValidation && issues.length>0 && (
        <div className="warn-box">
          <b>Please review before exporting:</b>
          <ul style={{margin:'6px 0 0 18px'}}>
            {issues.slice(0,8).map((m,i)=><li key={i}>{m}</li>)}
            {issues.length>8 && <li>...and {issues.length-8} more.</li>}
          </ul>
        </div>
      )}
      {excelError && (
        <div className="err-box">{excelError}</div>
      )}
      {zipError && (
        <div className="err-box">{zipError}</div>
      )}

      <div className="card">
        <h2 style={{fontSize:17}}>Project details</h2>
        <div className="grid grid-3" style={{marginTop:12}}>
          <Field label="Activity name" value={comp.project.activityName} onChange={v=>mutate({project:{...comp.project,activityName:v}})} placeholder="e.g. Electrical Maintenance Work"/>
          <Field label="Comparison date" type="date" value={comp.project.comparisonDate} onChange={v=>mutate({project:{...comp.project,comparisonDate:v}})}/>
          <Field label="Prepared by" value={comp.project.preparedBy} onChange={v=>mutate({project:{...comp.project,preparedBy:v}})} placeholder="Name"/>
          <Field label="Department / location" value={comp.project.department} onChange={v=>mutate({project:{...comp.project,department:v}})} placeholder="e.g. Gurugram Facility"/>
          <label className="field">Activity status
            <select value={comp.project.status||'Pending'} onChange={e=>mutate({project:{...comp.project,status:e.target.value}})}>{STATUSES.map(st=><option key={st}>{st}</option>)}</select>
          </label>
          <label className="field">Reference no. (auto)
            <input value={comp.refNo?formatRef(comp.refNo):'Assigned on Save'} disabled />
          </label>
        </div>
      </div>

      <SelectedVendorBanner l1={l1}/>

      <VendorCards vendors={comp.vendors} onChange={v=>mutate({vendors:v})} rankByVendorId={rankByVendorId} quotations={quotations} onQuotationUpload={handleQuotationUpload} onQuotationRemove={handleQuotationRemove} onVendorCountChange={setVendorCount}/>
      <BOQTable boqLines={comp.boqLines} vendors={comp.vendors} rates={comp.rates} onLines={v=>mutate({boqLines:v})} onRates={v=>mutate({rates:v})}/>
      <CostSummaryCards ordered={ordered}/>
      <ComparisonPreview project={comp.project} refNo={comp.refNo} boqLines={comp.boqLines} ordered={ordered}/>
    </div>
    {confirmDialog}
  </div>;
}

/* ---------------- App ---------------- */
function App(){
  const [view, setView] = useState('dashboard');
  const [comparisons, setComparisons] = useState(()=>loadComparisons());
  const [lastRef, setLastRef] = useState(()=>loadLastRef());
  const [current, setCurrent] = useState(null);
  const [confirmAsync, confirmDialog] = useConfirmDialog();

  const cloudOn = CLOUD_ON();
  const [signed,setSigned]=useState(!cloudOn); const [cState,setCState]=useState(cloudOn?'locked':'off'); const [cMsg,setCMsg]=useState('Signed out');
  const [cErr,setCErr]=useState(''); const [cEmail,setCEmail]=useState(''); const [cBusy,setCBusy]=useState(cloudOn && !!localStorage.getItem('vcc_cloud_signed'));
  const stamp=()=>new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
  const pullAndSync = async () => {
    setCState('syncing'); setCMsg('Syncing\u2026');
    try{
      const remote=await cloudPull(); const localTs=safeNum(localStorage.getItem('vcc_local_ts'));
      if(remote && Array.isArray(remote.comparisons) && remote.ts>localTs){ // Drive copy is newer than this device: take it, keeping a local snapshot first
        pushBackup(loadComparisons(),'Before cloud load');
        saveComparisons(remote.comparisons,'Cloud load',true); localStorage.setItem('vcc_local_ts',String(remote.ts));
        const nl=Math.max(remote.lastRef||0,loadLastRef()); saveLastRef(nl); setComparisons(remote.comparisons); setLastRef(nl);
      } else { await cloudPushNow(); }
      setCState('ok'); setCMsg('Synced '+stamp());
    }catch(e){ setCState('error'); setCMsg('Sync failed: '+e.message); }
  };
  const doSignIn = async (prompt) => {
    setCErr(''); setCBusy(true);
    try{ const em=await cloudSignIn(prompt); setCEmail(em); setSigned(true); localStorage.setItem('vcc_cloud_signed','1'); setCBusy(false); await pullAndSync(); }
    catch(e){ setCErr(e.message); setSigned(false); setCBusy(false); }
  };
  const doSync = () => { if(Cloud.token && Date.now()<Cloud.exp) pullAndSync(); else doSignIn(''); };
  const doSignOut = async () => {
    const ok=await confirmAsync('Sign out? Your latest data is saved to Google Drive first, then the copy kept on this device is removed.'); if(!ok) return;
    try{ await cloudEnsureToken(); await cloudPushNow(); }
    catch(e){ const f=await confirmAsync('Could not save to Google Drive ('+e.message+'). Sign out anyway and REMOVE the unsynced local data?'); if(!f) return; }
    if(Cloud.token) google.accounts.oauth2.revoke(Cloud.token,()=>{});
    Cloud.token=null; Cloud.fileId=null; Cloud.email=null;
    [LS_COMPARISONS,LS_LASTREF,LS_BACKUPS,'vcc_local_ts','vcc_cloud_signed','vcc_cloud_bk_day'].forEach(k=>localStorage.removeItem(k));
    setComparisons([]); setLastRef(0); setCurrent(null); setView('dashboard'); setSigned(false); setCEmail(''); setCState('locked'); setCMsg('Signed out');
  };
  useEffect(()=>{ if(cloudOn && localStorage.getItem('vcc_cloud_signed')) doSignIn(''); },[]);
  useEffect(()=>{
    if(!cloudOn||!signed) return; let t;
    window.__cloudPush=()=>{ clearTimeout(t); t=setTimeout(async()=>{ try{ setCState('syncing'); setCMsg('Saving to Drive\u2026'); await cloudEnsureToken(); await cloudPushNow(); setCState('ok'); setCMsg('Saved to Drive '+stamp()); }catch(e){ setCState('error'); setCMsg('Not saved to Drive - press Sync now'); } },1200); };
    return ()=>{ window.__cloudPush=null; clearTimeout(t); };
  },[signed]);
  const cloud={on:cloudOn,state:cState,msg:cMsg,email:cEmail,sync:doSync,signOut:doSignOut};

  const goDashboard = () => setView('dashboard');

  const handleNew = () => { setCurrent(blankState()); setView('editor'); };
  const handleOpen = (refNo) => {
    const found = comparisons.find(c=>c.refNo===refNo);
    if(!found) return;
    setCurrent({...found, isSaved:true});
    setView('editor');
  };
  const handleDuplicate = (refNo) => {
    const found = comparisons.find(c=>c.refNo===refNo);
    if(!found) return;
    setCurrent({...found, refNo:null, isSaved:false, docs:[], project:{...found.project,status:'Pending'}});
    setView('editor');
  };
  const handleDelete = async (refNo) => {
    const ok = await confirmAsync('Delete '+formatRef(refNo)+'? This cannot be undone. (An automatic backup snapshot is kept.)');
    if(!ok) return;
    const next = comparisons.filter(c=>c.refNo!==refNo);
    setComparisons(next); saveComparisons(next,'Delete '+formatRef(refNo));
  };
  const handleStatus = (refNo,status) => { const list=comparisons.map(c=>c.refNo===refNo?{...c,project:{...c.project,status}}:c); setComparisons(list); saveComparisons(list,'Status change'); };
  const handleRestore = async (list,last,files,label) => {
    const ok = await confirmAsync('Restore '+label+'? This replaces the '+comparisons.length+' comparison(s) currently saved with '+list.length+'. A safety snapshot of the current data is kept first.');
    if(!ok) return;
    pushBackup(comparisons,'Before restore');
    const nl = Math.max(last||0,lastRef,...list.map(c=>c.refNo||0));
    setComparisons(list); saveComparisons(list,'Restore'); setLastRef(nl); saveLastRef(nl);
  };
  const handleSaved = (comp) => {
    if(!comp.refNo){
      const nextNo = lastRef+1;
      const record = {...comp, refNo:nextNo, isSaved:true};
      const list = [...comparisons, record];
      setComparisons(list); saveComparisons(list);
      setLastRef(nextNo); saveLastRef(nextNo);
      setCurrent(record);
      return record;
    } else {
      const record = {...comp, isSaved:true};
      const list = comparisons.map(c=>c.refNo===comp.refNo?record:c);
      setComparisons(list); saveComparisons(list);
      setCurrent(record);
      return record;
    }
  };

  if(cloudOn && !signed) return <React.Fragment><BrandBar cloud={null}/><LoginScreen onSignIn={doSignIn} err={cErr} busy={cBusy}/></React.Fragment>;
  if(view==='editor' && current){
    return <React.Fragment><BrandBar cloud={cloud}/><Editor initial={current} onBack={goDashboard} onSaved={handleSaved}/>{confirmDialog}</React.Fragment>;
  }
  return <React.Fragment>
    <BrandBar cloud={cloud}/>
    <Dashboard comparisons={comparisons} lastRef={lastRef} onNew={handleNew} onOpen={handleOpen} onDuplicate={handleDuplicate} onDelete={handleDelete} onStatus={handleStatus} onRestore={handleRestore} cloudOn={cloudOn}/>
    {confirmDialog}
  </React.Fragment>;
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
